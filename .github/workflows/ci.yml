name: CI

on:
  pull_request:
  push:
    branches: [staging, main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  code:
    name: Lint, typecheck, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check

  migrations:
    name: Migrations sur base jetable
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      # Base locale jetable : prouve que migrations + seed se rejouent de zéro.
      # Rien ici ne touche la base réelle.
      - run: supabase start
      - run: supabase db reset
      - if: always()
        run: supabase stop --no-backup

  appliquer-migrations:
    name: Appliquer les migrations à la base réelle
    needs: [code, migrations]
    # Seulement au merge dans staging : une migration part en base dès qu'elle est intégrée,
    # et elle est toujours compatible avec le code de main (on ajoute, on ne retire pas).
    # main ne rejoue rien : la base est déjà à jour quand staging y est promu.
    if: github.event_name == 'push' && github.ref == 'refs/heads/staging'
    runs-on: ubuntu-latest
    environment: supabase
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Lier le projet
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: supabase link --project-ref ybcdppcdgbbujmlmimqs
      - name: Pousser les migrations
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        # Trois pieges, mesures le 10/11 sur ce projet, dans cet ordre :
        #  1. sans cible explicite, la CLI vise la base locale (127.0.0.1:54322), absente du job ;
        #  2. la connexion directe db.<ref>.supabase.co n'ecoute qu'en IPv6, les runners GitHub
        #     sont en IPv4 — on passe donc par le pooler en mode session (port 5432, le seul qui
        #     accepte les migrations), hote aws-0-ap-southeast-1 pour la region du projet ;
        #  3. la CLI demande une confirmation avant d'appliquer et, sans terminal, renonce en
        #     disant « Nothing was changed » tout en sortant 0 : d'ou `--yes`, avec un repli par
        #     l'entree standard si la version de CLI ne connait pas ce drapeau.
        run: |
          set -euo pipefail
          url="postgresql://postgres.ybcdppcdgbbujmlmimqs:$(jq -rn --arg p "$SUPABASE_DB_PASSWORD" '$p|@uri')@aws-0-ap-southeast-1.pooler.supabase.com:5432/postgres"
          supabase db push --include-all --yes --db-url "$url" \
            || yes | supabase db push --include-all --db-url "$url"
      - name: Deployer les Edge Functions
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          if ls supabase/functions/*/index.ts >/dev/null 2>&1; then
            # `--yes` pour la meme raison que le push des migrations : sans terminal, la CLI
            # renonce (« Nothing was changed »). `--remote=<ref>` remplace `--project-ref`,
            # deprecie. `verify_jwt` vient de supabase/config.toml, pas de la ligne de commande.
            # Deploiement fonction par fonction : le deploiement global commence par lister
            # les fonctions du projet, et le jeton de la CI n'a pas `edge_functions_read`
            # (403 mesure le 10/11). Nommer la fonction evite cet appel de liste.
            for f in supabase/functions/*/; do
              nom="$(basename "$f")"
              supabase functions deploy "$nom" --yes --remote=ybcdppcdgbbujmlmimqs
            done
          else
            echo "aucune Edge Function a deployer"
          fi
