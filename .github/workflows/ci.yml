name: CI

on:
  pull_request:
  push:
    branches: [staging, main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  code:
    name: Lint, typecheck, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check

  migrations:
    name: Migrations sur base jetable
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      # Base locale jetable : prouve que migrations + seed se rejouent de zéro.
      # Rien ici ne touche la base réelle.
      - run: supabase start
      - run: supabase db reset
      - if: always()
        run: supabase stop --no-backup

  appliquer-migrations:
    name: Appliquer les migrations à la base réelle
    needs: [code, migrations]
    # Seulement au merge dans staging : une migration part en base dès qu'elle est intégrée,
    # et elle est toujours compatible avec le code de main (on ajoute, on ne retire pas).
    # main ne rejoue rien : la base est déjà à jour quand staging y est promu.
    if: github.event_name == 'push' && github.ref == 'refs/heads/staging'
    runs-on: ubuntu-latest
    environment: supabase
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Lier le projet
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: supabase link --project-ref ybcdppcdgbbujmlmimqs
      - name: Pousser les migrations
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        # Deux pieges, mesures le 10/11 sur ce projet :
        #  - sans cible explicite, la CLI vise la base locale (127.0.0.1:54322), absente du job ;
        #  - la connexion directe db.<ref>.supabase.co n'ecoute qu'en IPv6, et les runners GitHub
        #    sont en IPv4 (« IPv6 is not supported on your current network »).
        # On passe donc par le pooler, en session (5432, seul mode qui accepte les migrations).
        # Le prefixe d'hote du pooler varie selon l'age du projet : on essaie les deux, puis la
        # connexion directe en dernier recours, et on s'arrete au premier succes.
        run: |
          encoded="$(jq -rn --arg p "$SUPABASE_DB_PASSWORD" '$p|@uri')"
          for host in aws-0-ap-southeast-1.pooler.supabase.com aws-1-ap-southeast-1.pooler.supabase.com; do
            echo "::group::db push via $host"
            if supabase db push --include-all \
                 --db-url "postgresql://postgres.ybcdppcdgbbujmlmimqs:$encoded@$host:5432/postgres"; then
              echo "::endgroup::"
              echo "migrations appliquees via $host"
              exit 0
            fi
            echo "::endgroup::"
          done
          echo "pooler injoignable, tentative en connexion directe"
          supabase db push --include-all --remote
      # Les Edge Functions suivent le meme chemin que les migrations : jamais deployees a la
      # main. `verify_jwt` vient de supabase/config.toml. Saute tant qu'il n'y en a aucune.
      - name: Deployer les Edge Functions
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          if ls supabase/functions/*/index.ts >/dev/null 2>&1; then
            supabase functions deploy --project-ref ybcdppcdgbbujmlmimqs
          else
            echo "aucune Edge Function a deployer"
          fi
