# Configuration de la base locale jetable (`supabase start`), utilisée en développement et dans
# la CI. `project_id` lie le dossier au projet distant ybcdppcdgbbujmlmimqs : une seule base
# pour staging et la prod (decisions/2026-11-09-une-seule-base.md).
project_id = "ybcdppcdgbbujmlmimqs"

[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 17

[studio]
enabled = true
port = 54323

# Authentification : e-mail et mot de passe, comptes créés par le seed
# (decisions/2026-11-10-authentification.md).
#
# `enable_signup = false` est la serrure de tout le dispositif : la clé publishable part dans le
# navigateur de chaque visiteur, et sans ce verrou n'importe qui s'inscrirait pour obtenir le rôle
# `authenticated`, qui écrit dans `partners`. Ce fichier ne règle QUE la base locale et la CI :
# sur le projet réel, le même réglage se fait dans le tableau de bord Supabase (la CI ne pousse
# pas la configuration d'auth). Voir « Attend Ghya » de la PR.
#
# `enable_confirmations = false` : aucun e-mail n'est envoyé, le seed confirme les adresses.
[auth]
enabled = true
site_url = "http://localhost:3000"
additional_redirect_urls = ["http://localhost:3000", "http://localhost:3001"]
jwt_expiry = 3600
enable_signup = false

[auth.email]
enable_signup = false
enable_confirmations = false

[storage]
enabled = true


# Edge Functions. `verify_jwt = false` : il n'y a pas d'authentification dans ce parcours
# (PART-7, DEMO-4, DEMO-20), les deux fonctions sont appelées depuis le navigateur avec la
# seule clé publishable. Ces deux entrées ne valent que déclarées EN MÊME TEMPS que leur
# `index.ts` : déclarées seules, elles font échouer `supabase start` dans la CI.
[functions.acheter-pass]
verify_jwt = false

[functions.valider-pass]
verify_jwt = false
